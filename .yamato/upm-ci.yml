swift_trampoline_editors:
  - version: trunk
  - version: 6000.7
  - version: 6000.6

test_editors:
  - version: trunk
  - version: 6000.7
  - version: 6000.6
  - version: 6000.3
  - version: 6000.0

artifactory:
  production: https://artifactory.prd.it.unity3d.com/artifactory/api/

infrastructure_setup:
  - command: curl -s https://artifactory.prd.it.unity3d.com/artifactory/unity-tools-local/utr-standalone/utr --output utr
  - command: chmod u+x utr
  - command: brew tap unity/homebrew-unity git@github.cds.internal.unity3d.com:unity/homebrew-unity.git
  - command: brew trust unity/unity
  - command: brew install unity/unity/unity-downloader-cli

android_paths:
  jdk: /Users/bokken/build/output/Unity-Technologies/com.unity.mobile.notifications/.Editor/PlaybackEngines/AndroidPlayer/OpenJDK
  sdk: /Users/bokken/build/output/Unity-Technologies/com.unity.mobile.notifications/.Editor/PlaybackEngines/AndroidPlayer/SDK
  ndk: /Users/bokken/build/output/Unity-Technologies/com.unity.mobile.notifications/.Editor/PlaybackEngines/AndroidPlayer/NDK

---

{% for editor in test_editors %}
test_Android_{{ editor.version }}:
  name: Test {{ editor.version }} on Android
  agent:
    type: Unity::metal::macmini
    image: mobile/android-emulator-macos-base-slim-unity:v2.9302489
    flavor: b1.large
    model: M2-macos14
  commands:
{% for cmd in infrastructure_setup %}
    - {{ cmd.command }}
{% endfor %}
    - unity-downloader-cli -c Editor -c Android -u {{ editor.version }} --wait --fast --arch arm64
    - |
       export JAVA_HOME={{ android_paths.jdk }}
       export ANDROID_SDK_ROOT={{ android_paths.sdk }}
       export ANDROID_NDK_ROOT={{ android_paths.ndk }}
       ./utr --testproject=TestProjects/AutomatedTests --editor-location=.Editor --suite=playmode --platform=android --scripting-backend=il2cpp --architecture=arm64 --artifacts_path=upm-ci~/test-results/android --timeout=900  --extra-editor-arg="-upmNoDefaultPackages" --player-save-path=build/players --build-only
    - |
       set ANDROID_DEVICE_CONNECTION=%BOKKEN_DEVICE_IP%
       %ANDROID_SDK_ROOT%\platform-tools\adb.exe connect %BOKKEN_DEVICE_IP%
       %ANDROID_SDK_ROOT%\platform-tools\adb.exe logcat -b all -c
       utr.bat --testproject=TestProjects\AutomatedTests --editor-location=.Editor --suite=playmode --platform=android --scripting-backend=il2cpp  --architecture=arm64 --artifacts_path=upm-ci~/test-results/android --timeout=900 --player-load-path=build/players
  after:
    - |
       start /wait %ANDROID_SDK_ROOT%\platform-tools\adb.exe connect %BOKKEN_DEVICE_IP%
       %ANDROID_SDK_ROOT%\platform-tools\adb.exe logcat -d -T 1000 > upm-ci~/test-results/android/android_device_log.txt
  artifacts:
    packages:
      paths:
        - "upm-ci~/**/*"
  dependencies:
    - .yamato/wrench/package-pack-jobs.yml#package_pack_-_mobile_notifications
{% endfor %}

{% for editor in test_editors %}
test_iOS_{{ editor.version }}:
  name: Test {{ editor.version }} on iOS
  agent:
    type: Unity::VM::osx
    image: automation-tooling/macos-14-arm64-unity:v2.7891464
    flavor: b1.medium
    model: M1
  variables:
    IOS_SIMULATOR_SDK: 1
    HOMEBREW_NO_AUTO_UPDATE: 1
    HOMEBREW_NO_INSTALL_FROM_API: 1
  commands:
{% for cmd in infrastructure_setup %}
    - {{ cmd.command }}
{% endfor %}
    - unity-downloader-cli -c Editor -c iOS -u {{ editor.version }} --wait --fast --arch arm64
    - ./utr --testproject=TestProjects/AutomatedTests --editor-location=.Editor --suite=playmode --platform=ios --artifacts_path=upm-ci~/test-results/ios --timeout=900 --extra-editor-arg="-upmNoDefaultPackages" --player-save-path=build/players --build-only
    - ./utr --testproject=TestProjects/AutomatedTests --editor-location=.Editor --suite=playmode --platform=ios --artifacts_path=upm-ci~/test-results/ios --timeout=900 --player-load-path=build/players
  artifacts:
    packages:
      paths:
        - "upm-ci~/**/*"
  dependencies:
    - .yamato/wrench/package-pack-jobs.yml#package_pack_-_mobile_notifications
{% endfor %}

{% for editor in swift_trampoline_editors %}
test_iOS_Swift_{{ editor.version }}:
  name: Test {{ editor.version }} on iOS (Swift)
  agent:
    type: Unity::VM::osx
    image: automation-tooling/macos-14-arm64-unity:v2.7891464
    flavor: b1.medium
    model: M1
  variables:
    IOS_SIMULATOR_SDK: 1
    HOMEBREW_NO_AUTO_UPDATE: 1
    HOMEBREW_NO_INSTALL_FROM_API: 1
  commands:
{% for cmd in infrastructure_setup %}
    - {{ cmd.command }}
{% endfor %}
    - unity-downloader-cli -c Editor -c iOS -u {{ editor.version }} --wait --fast --arch arm64
    - ./utr --testproject=TestProjects/AutomatedTests --editor-location=.Editor --suite=playmode --platform=ios --artifacts_path=upm-ci~/test-results/ios --timeout=900 --extra-editor-arg="-upmNoDefaultPackages" --extra-editor-arg="-executeMethod" --extra-editor-arg=UnityEditor.iOS.iOSTests.UseSwiftTrampoline --player-save-path=build/players --build-only
    - ./utr --testproject=TestProjects/AutomatedTests --editor-location=.Editor --suite=playmode --platform=ios --artifacts_path=upm-ci~/test-results/ios --timeout=900 --extra-editor-arg="-executeMethod" --extra-editor-arg=UnityEditor.iOS.iOSTests.UseSwiftTrampoline --player-load-path=build/players
  artifacts:
    packages:
      paths:
        - "upm-ci~/**/*"
  dependencies:
    - .yamato/wrench/package-pack-jobs.yml#package_pack_-_mobile_notifications
{% endfor %}

test_trigger:
  name: Tests Trigger
  agent:
    type: Unity::VM
    image: package-ci/ubuntu:stable
    flavor: b1.large
  commands:
    - dir
  triggers:
    branches:
      only:
        - "/.*/"
  artifacts:
    logs:
      paths:
        - "upm-ci~/test-results/**/*"
    packages:
      paths:
        - "upm-ci~/packages/**/*"
  dependencies:
    - .yamato/wrench/package-pack-jobs.yml#package_pack_-_mobile_notifications
    {% for editor in test_editors %}
    - .yamato/upm-ci.yml#test_Android_{{ editor.version }}
    - .yamato/upm-ci.yml#test_iOS_{{ editor.version }}
    {% endfor %}
    {% for editor in swift_trampoline_editors %}
    - .yamato/upm-ci.yml#test_iOS_Swift_{{ editor.version }}
    {% endfor %}
